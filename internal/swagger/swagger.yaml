    type: object
  proto.ConfigSetRequest:
    properties:
      key:
        type: string
      scope:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Scope'
      value: {}
    type: object
  proto.CurrentSession:
    properties:
      session_id:
        type: string
    type: object
  proto.Error:
    properties:
      message:
        type: string
    type: object
  proto.File:
    properties:
      content:
        type: string
      created_at:
        type: integer
      id:
        type: string
      path:
        type: string
      session_id:
        type: string
      updated_at:
        type: integer
      version:
        type: integer
