basePath: /v1
definitions:
  catwalk.ImageLimits:
    properties:
      max_aggregate_bytes:
        type: integer
      max_aggregate_pixels:
        type: integer
      max_bytes_per_image:
        type: integer
      max_images:
        type: integer
      max_long_edge:
        type: integer
    type: object
  catwalk.Model:
    properties:
      can_reason:
        type: boolean
      context_window:
        type: integer
      cost_per_1m_in:
        type: number
      cost_per_1m_in_cached:
        type: number
      cost_per_1m_out:
        type: number
      cost_per_1m_out_cached:
        type: number
      default_max_tokens:
        type: integer
      default_reasoning_effort:
        type: string
      id:
        type: string
      image:
        allOf:
        - $ref: '#/definitions/catwalk.ImageLimits'
        description: |-
          Image holds per-model image-input constraints. When zero, callers
          should resolve the provider-family defaults via
          [Model.ResolveImageLimits]; non-zero fields override those
          defaults (e.g. newer Claude models that allow a larger long edge).
      long_context_cost_per_1m_in:
        description: |-
          Long context pricing (when >200K input tokens with 1M context enabled).
          These are the premium rates; standard rates are in the CostPer1M* fields above.
        type: number
      long_context_cost_per_1m_in_cached:
        type: number
      long_context_cost_per_1m_out:
        type: number
      name:
        type: string
      options:
        $ref: '#/definitions/catwalk.ModelOptions'
      reasoning_levels:
        items:
          type: string
        type: array
      supports_1m_context:
        description: Supports1MContext indicates the model supports the 1M context
          window beta feature.
        type: boolean
      supports_attachments:
        type: boolean
    type: object
  catwalk.ModelOptions:
    properties:
      frequency_penalty:
        type: number
      presence_penalty:
        type: number
      provider_options:
        additionalProperties: {}
        type: object
      temperature:
        type: number
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  config.Attribution:
    properties:
      co_authored_by:
        type: boolean
      trailer_style:
        $ref: '#/definitions/config.TrailerStyle'
    type: object
  config.Completions:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  config.ContextMode:
    enum:
    - standard
    - extended
    - dynamic
    type: string
    x-enum-varnames:
    - ContextModeStandard
    - ContextModeExtended
    - ContextModeDynamic
  config.HookConfig:
    properties:
      command:
        description: Shell command to execute.
        type: string
      matcher:
        description: Regex pattern tested against the tool name. Empty means match
          all.
        type: string
      timeout:
        description: Timeout in seconds. Default 30.
        type: integer
    type: object
  config.LSPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      filetypes:
        items:
          type: string
        type: array
      init_options:
        additionalProperties: {}
        type: object
      options:
        additionalProperties: {}
        type: object
      root_markers:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  config.LSPs:
    additionalProperties:
      $ref: '#/definitions/config.LSPConfig'
    type: object
  config.MCPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      disabled_tools:
        items:
          type: string
        type: array
      enabled_tools:
        items:
          type: string
        type: array
      env:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers are HTTP headers for HTTP/SSE MCP servers. Values run
          through shell expansion at MCP startup, so $VAR and $(cmd)
          work. A header whose value resolves to the empty string (unset
          bare $VAR under lenient nounset, $(echo), or literal "") is
          omitted from the outgoing request rather than sent as
          "Header:".
        type: object
      timeout:
        type: integer
      type:
        $ref: '#/definitions/config.MCPType'
      url:
        type: string
    type: object
  config.MCPType:
    enum:
    - stdio
    - sse
    - http
    type: string
    x-enum-varnames:
    - MCPStdio
    - MCPSSE
    - MCPHttp
  config.MCPs:
    additionalProperties:
      $ref: '#/definitions/config.MCPConfig'
    type: object
  config.Permissions:
    properties:
      allowed_tools:
        items:
          type: string
        type: array
    type: object
  config.PostCreateHook:
    properties:
      if_exists:
        description: IfExists is a file to check for before running the command.
        type: string
      run:
        description: Run is the command to execute.
        type: string
    type: object
  config.SelectedModel:
    properties:
      context_mode:
        allOf:
        - $ref: '#/definitions/config.ContextMode'
        description: ContextMode controls how the model handles context window limits
          for models that support extended context.
      frequency_penalty:
        type: number
      max_tokens:
        description: Overrides the default model configuration.
        type: integer
      model:
        description: |-
          The model id as used by the provider API.
          Required.
        type: string
      presence_penalty:
        type: number
      provider:
        description: |-
          The model provider, same as the key/id used in the providers config.
          Required.
        type: string
      provider_options:
        additionalProperties: {}
        description: Override provider specific options.
        type: object
      reasoning_effort:
        description: Only used by models that use the openai provider and need this
          set.
        type: string
      temperature:
        type: number
      think:
        description: Used by anthropic models that can reason to indicate if the model
          should think.
        type: boolean
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  config.SelectedModelType:
    enum:
    - large
    - small
    type: string
    x-enum-varnames:
    - SelectedModelTypeLarge
    - SelectedModelTypeSmall
  config.SnapshotsConfig:
    properties:
      enabled:
        description: Enabled enables automatic snapshots on user messages.
        type: boolean
      exclude:
        description: Exclude is a list of glob patterns to exclude from snapshots.
        items:
          type: string
        type: array
    type: object
  config.TUIOptions:
    properties:
      compact_mode:
        type: boolean
      completions:
        $ref: '#/definitions/config.Completions'
      diff_mode:
        type: string
      low_bandwidth:
        description: |-
          LowBandwidth, when true, swaps the animated spinner for a simple
          "Generating .", "..", "..." cycle, halves the renderer FPS, and
          disables the session-title reveal animation. Useful over slow
          links or when the user wants reduced motion. Toggleable from the
          command palette and forced on by the CRUSH_LOW_BANDWIDTH env var.
        type: boolean
      theme:
        description: |-
          Theme selects the UI color theme by name. Builtin themes ("charmtone",
          "hypercrush") and user themes from $config/crush/themes/*.lua are
          supported. Local config overrides global, so a theme can be set
          per-workspace. Empty falls back to the provider-derived default.
        type: string
      transparent:
        type: boolean
    type: object
  config.ToolGrep:
    properties:
      timeout:
        $ref: '#/definitions/time.Duration'
    type: object
  config.ToolLs:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  config.Tools:
    properties:
      grep:
        $ref: '#/definitions/config.ToolGrep'
      ls:
        $ref: '#/definitions/config.ToolLs'
    type: object
  config.TrailerStyle:
    enum:
    - none
    - co-authored-by
    - assisted-by
    type: string
    x-enum-varnames:
    - TrailerStyleNone
    - TrailerStyleCoAuthoredBy
    - TrailerStyleAssistedBy
  config.WorktreeConfig:
    properties:
      enabled:
        description: Enabled controls whether worktrees are used (default true).
        type: boolean
      post_create:
        description: PostCreate defines commands to run after creating/restoring a
          worktree.
        items:
          $ref: '#/definitions/config.PostCreateHook'
        type: array
    type: object
  csync.Map-string-config_ProviderConfig:
    type: object
  fork.ForkParams:
    properties:
      createWorktree:
        description: CreateWorktree if true, creates a new worktree with the snapshot
          state.
        type: boolean
      messageID:
        description: |-
          MessageID is the message to fork from. The new session will include
          all messages up to and including this one.
        type: string
      sessionID:
        description: SessionID is the source session to fork from.
        type: string
      title:
        description: Title is the title for the new session. Auto-generated if empty.
        type: string
      worktreeName:
        description: WorktreeName is the name for the new worktree. Auto-generated
          if empty.
        type: string
    type: object
  github_com_taigrr_crush_internal_config.Config:
    properties:
      $schema:
        type: string
      hooks:
        additionalProperties:
          items:
            $ref: '#/definitions/config.HookConfig'
          type: array
        type: object
      lsp:
        $ref: '#/definitions/config.LSPs'
      mcp:
        $ref: '#/definitions/config.MCPs'
      models:
        additionalProperties:
          $ref: '#/definitions/config.SelectedModel'
        description: We currently only support large/small as values here.
        type: object
      options:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Options'
      permissions:
        $ref: '#/definitions/config.Permissions'
      providers:
        allOf:
        - $ref: '#/definitions/csync.Map-string-config_ProviderConfig'
        description: The providers that are configured
      recent_models:
        additionalProperties:
          items:
            $ref: '#/definitions/config.SelectedModel'
          type: array
        description: Recently used models stored in the data directory config.
        type: object
      snapshots:
        $ref: '#/definitions/config.SnapshotsConfig'
      tools:
        $ref: '#/definitions/config.Tools'
      worktree:
        $ref: '#/definitions/config.WorktreeConfig'
    type: object
  github_com_taigrr_crush_internal_config.Options:
    properties:
      attribution:
        $ref: '#/definitions/config.Attribution'
      auto_lsp:
        type: boolean
      context_paths:
        items:
          type: string
        type: array
      data_directory:
        description: |-
          DataDirectory is where Crush keeps per-project state such as
          the SQLite database and workspace overrides. Relative paths are
          resolved against the working directory; absolute paths are used
          verbatim. After defaulting the stored value is always absolute.
        type: string
      debug:
        type: boolean
      debug_lsp:
        type: boolean
      disable_auto_summarize:
        type: boolean
      disable_default_providers:
        type: boolean
      disable_metrics:
        type: boolean
      disable_notifications:
        type: boolean
      disable_provider_auto_update:
        type: boolean
      disabled_skills:
        items:
          type: string
        type: array
      disabled_tools:
        items:
          type: string
        type: array
      initialize_as:
        type: string
      notification_style:
        type: string
      progress:
        type: boolean
      skills_paths:
        items:
          type: string
        type: array
      tui:
        $ref: '#/definitions/config.TUIOptions'
    type: object
  github_com_taigrr_crush_internal_config.Scope:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - ScopeGlobal
    - ScopeWorkspace
  github_com_taigrr_crush_internal_proto.Message:
    properties:
      created_at:
        type: integer
      id:
        type: string
      model:
        type: string
      parts:
        items: {}
        type: array
      provider:
        type: string
      role:
        $ref: '#/definitions/proto.MessageRole'
      session_id:
        type: string
      updated_at:
        type: integer
    type: object
  lsp.ServerState:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    type: integer
    x-enum-varnames:
    - StateUnstarted
    - StateStarting
    - StateReady
    - StateError
    - StateStopped
    - StateDisabled
  proto.APIKeyKind:
    enum:
    - string
    - oauth
    type: string
    x-enum-varnames:
    - APIKeyKindString
    - APIKeyKindOAuth
  proto.AgentInfo:
    properties:
      is_busy:
        type: boolean
      is_ready:
        type: boolean
      model:
        $ref: '#/definitions/catwalk.Model'
      model_cfg:
        $ref: '#/definitions/config.SelectedModel'
    type: object
  proto.AgentMessage:
    properties:
      attachments:
        items:
          $ref: '#/definitions/proto.Attachment'
        type: array
      client_id:
        description: |-
          ClientID identifies the client that initiated the turn. The
          server uses it to route per-client resources (notably the editor
          bridge) to the right client. Empty means "no specific client".
        type: string
      prompt:
        type: string
      run_id:
        type: string
      session_id:
        type: string
    type: object
  proto.AgentSession:
    properties:
      attached_clients:
        type: integer
      completion_tokens:
        type: integer
      cost:
        type: number
      created_at:
        type: integer
      id:
        type: string
      is_busy:
        type: boolean
      is_extended_context:
        type: boolean
      message_count:
        type: integer
      parent_session_id:
        type: string
      prompt_tokens:
        type: integer
      summary_message_id:
        type: string
      title:
        type: string
      todos:
        items:
          $ref: '#/definitions/proto.Todo'
        type: array
      updated_at:
        type: integer
    type: object
  proto.Attachment:
    properties:
      content:
        items:
          type: integer
        type: array
      file_name:
        type: string
      file_path:
        type: string
      mime_type:
        type: string
    type: object
  proto.ConfigCompactRequest:
    properties:
      enabled:
        type: boolean
      scope:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Scope'
    type: object
  proto.ConfigModelRequest:
    properties:
      model:
        $ref: '#/definitions/config.SelectedModel'
      model_type:
        $ref: '#/definitions/config.SelectedModelType'
      scope:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Scope'
    type: object
  proto.ConfigProviderKeyRequest:
    properties:
      api_key:
        items:
          type: integer
        type: array
      kind:
        $ref: '#/definitions/proto.APIKeyKind'
      provider_id:
        type: string
      scope:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Scope'
    type: object
  proto.ConfigRefreshOAuthRequest:
    properties:
