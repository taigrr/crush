        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Config'
      data_dir:
        type: string
      debug:
        type: boolean
      env:
        items:
          type: string
        type: array
      git_branch:
        type: string
      id:
        type: string
      isolated:
        type: boolean
      path:
        type: string
      skills:
        items:
          $ref: '#/definitions/proto.SkillState'
