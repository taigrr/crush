basePath: /v1
definitions:
  catwalk.ImageLimits:
    properties:
      max_aggregate_bytes:
        type: integer
      max_aggregate_pixels:
        type: integer
      max_bytes_per_image:
        type: integer
      max_images:
        type: integer
      max_long_edge:
        type: integer
    type: object
  catwalk.Model:
    properties:
      can_reason:
        type: boolean
      context_window:
        type: integer
      cost_per_1m_in:
        type: number
      cost_per_1m_in_cached:
        type: number
      cost_per_1m_out:
        type: number
      cost_per_1m_out_cached:
        type: number
      default_max_tokens:
        type: integer
      default_reasoning_effort:
        type: string
      dimensions:
        description: |-
          Dimensions is the size of the output vector for embedding models.
          For embedding models that support multiple output sizes this is the
          default/recommended dimensionality. It is zero for chat models.
        type: integer
      id:
        type: string
      image:
        allOf:
        - $ref: '#/definitions/catwalk.ImageLimits'
        description: |-
          Image holds per-model image-input constraints. When zero, callers
          should resolve the provider-family defaults via
          [Model.ResolveImageLimits]; non-zero fields override those
          defaults (e.g. newer Claude models that allow a larger long edge).
      long_context_cost_per_1m_in:
        description: |-
          Long context pricing (when >200K input tokens with 1M context enabled).
          These are the premium rates; standard rates are in the CostPer1M* fields above.
        type: number
      long_context_cost_per_1m_in_cached:
        type: number
      long_context_cost_per_1m_out:
        type: number
      name:
        type: string
      options:
        $ref: '#/definitions/catwalk.ModelOptions'
      reasoning_levels:
        items:
          type: string
        type: array
      supports_1m_context:
        description: Supports1MContext indicates the model supports the 1M context
          window beta feature.
        type: boolean
      supports_attachments:
        type: boolean
    type: object
  catwalk.ModelOptions:
    properties:
      frequency_penalty:
        type: number
      presence_penalty:
        type: number
      provider_options:
        additionalProperties: {}
        type: object
      temperature:
        type: number
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  config.Attribution:
    properties:
      co_authored_by:
        type: boolean
      trailer_style:
        $ref: '#/definitions/config.TrailerStyle'
    type: object
  config.Completions:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  config.EmbeddingConfig:
    properties:
      dimensions:
        description: |-
          Dimensions optionally requests a specific output dimensionality for
          models that support it. Zero means the model default.
        type: integer
      hybrid_search:
        description: |-
          HybridSearch controls whether search surfaces fuse the semantic
          (vector) signal with substring matching. Nil means the default
          (true when an embedder is configured). When false, search is pure
          substring and no query embeddings are computed. Toggling this does
          NOT invalidate stored vectors (it is not part of the signature).
        type: boolean
      model:
        description: Model is the embedding model id as used by the provider API.
        type: string
      normalize:
        description: |-
          Normalize requests unit-normalized vectors (so cosine reduces to a
          dot product) for models that support it.
        type: boolean
      provider:
        description: |-
          Provider is the provider id, matching a key in the providers
          config (same semantics as SelectedModel.Provider).
        type: string
    type: object
  config.HookConfig:
    properties:
      command:
        description: Shell command to execute.
        type: string
      matcher:
        description: Regex pattern tested against the tool name. Empty means match
          all.
        type: string
      timeout:
        description: Timeout in seconds. Default 30.
        type: integer
    type: object
  config.LSPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      filetypes:
        items:
          type: string
        type: array
      init_options:
        additionalProperties: {}
        type: object
      options:
        additionalProperties: {}
        type: object
      root_markers:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  config.LSPs:
    additionalProperties:
      $ref: '#/definitions/config.LSPConfig'
    type: object
  config.MCPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      disabled_tools:
        items:
          type: string
        type: array
      enabled_tools:
        items:
          type: string
        type: array
      env:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers are HTTP headers for HTTP/SSE MCP servers. Values run
          through shell expansion at MCP startup, so $VAR and $(cmd)
          work. A header whose value resolves to the empty string (unset
          bare $VAR under lenient nounset, $(echo), or literal "") is
          omitted from the outgoing request rather than sent as
          "Header:".
        type: object
      oauth:
        description: |-
          OAuth enables the MCP OAuth 2.1 authorization flow for HTTP
          transport servers. When true, the client uses dynamic client
          registration and opens a browser for the user to authorize.
          Tokens are persisted automatically. Only supported for type=http.
        type: boolean
      oauth_callback_port:
        description: |-
          OAuthCallbackPort pins the localhost port used for the OAuth
          redirect listener. Set this when the OAuth provider requires an
          exact-match callback URL (e.g. GitHub OAuth Apps). When omitted,
          Crush picks the first free port from its default range.
        type: integer
      oauth_client_id:
        description: |-
          OAuthClientID is an optional pre-registered OAuth client ID. Set
          it for servers that do not support dynamic client registration
          (e.g. GitHub, Slack) and instead issue client credentials when you
          register an OAuth app. Values run through shell expansion, so
          $VAR and $(cmd) work.
        type: string
      oauth_client_secret:
        description: |-
          OAuthClientSecret is the optional secret paired with
          OAuthClientID for confidential clients. Values run through shell
          expansion, so $VAR and $(cmd) work.
        type: string
      oauth_token:
        allOf:
        - $ref: '#/definitions/oauth.Token'
        description: |-
          OAuthToken is the persisted OAuth token for this server. It is
          managed internally and stored in the global data config.
      timeout:
        type: integer
      type:
        $ref: '#/definitions/config.MCPType'
      url:
        type: string
    type: object
  config.MCPType:
    enum:
    - stdio
    - sse
    - http
    type: string
    x-enum-varnames:
    - MCPStdio
    - MCPSSE
    - MCPHttp
  config.MCPs:
    additionalProperties:
      $ref: '#/definitions/config.MCPConfig'
    type: object
  config.Permissions:
    properties:
      allowed_tools:
        items:
          type: string
        type: array
    type: object
  config.PostCreateHook:
    properties:
      if_exists:
        description: IfExists is a file to check for before running the command.
        type: string
      run:
        description: Run is the command to execute.
        type: string
    type: object
  config.SelectedModel:
    properties:
      frequency_penalty:
        type: number
      max_tokens:
        description: Overrides the default model configuration.
        type: integer
      model:
        description: |-
          The model id as used by the provider API.
          Required.
        type: string
      presence_penalty:
        type: number
      provider:
        description: |-
          The model provider, same as the key/id used in the providers config.
          Required.
        type: string
      provider_options:
        additionalProperties: {}
        description: Override provider specific options.
        type: object
      reasoning_effort:
        description: Only used by models that use the openai provider and need this
          set.
        type: string
      temperature:
        type: number
      think:
        description: Used by anthropic models that can reason to indicate if the model
          should think.
        type: boolean
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  config.SelectedModelType:
    enum:
    - large
    - small
    - worker
    type: string
    x-enum-varnames:
    - SelectedModelTypeLarge
    - SelectedModelTypeSmall
    - SelectedModelTypeWorker
  config.SnapshotsConfig:
    properties:
      enabled:
        description: Enabled enables automatic snapshots on user messages.
        type: boolean
      exclude:
        description: Exclude is a list of glob patterns to exclude from snapshots.
        items:
          type: string
        type: array
    type: object
  config.SoundEvent:
    properties:
      disabled:
        type: boolean
      path:
        type: string
    type: object
  config.SoundOptions:
    properties:
      blocked:
        $ref: '#/definitions/config.SoundEvent'
      disabled:
        type: boolean
      end_of_turn:
        $ref: '#/definitions/config.SoundEvent'
      queued:
        $ref: '#/definitions/config.SoundEvent'
      swarm:
        $ref: '#/definitions/config.SoundEvent'
      tool_error:
        $ref: '#/definitions/config.SoundEvent'
    type: object
  config.TUIOptions:
    properties:
      compact_mode:
        type: boolean
      completions:
        $ref: '#/definitions/config.Completions'
      diff_mode:
        type: string
      low_bandwidth:
        description: |-
          LowBandwidth, when true, swaps the animated spinner for a simple
          "Generating .", "..", "..." cycle, halves the renderer FPS, and
          disables the session-title reveal animation. Useful over slow
          links or when the user wants reduced motion. Toggleable from the
          command palette and forced on by the CRUSH_LOW_BANDWIDTH env var.
        type: boolean
      sessions_sidebar_width:
        description: |-
          SessionsSidebarWidth is the width in columns of the left session
          navigator, persisted so a resize survives restarts. Zero means use
          the built-in default.
        type: integer
      theme:
        description: |-
          Theme selects the UI color theme by name. Builtin themes ("charmtone",
          "hypercrush") and user themes from $config/crush/themes/*.lua are
          supported. Local config overrides global, so a theme can be set
          per-workspace. Empty falls back to the provider-derived default.
        type: string
      transparent:
        type: boolean
    type: object
  config.ToolGrep:
    properties:
      timeout:
        $ref: '#/definitions/time.Duration'
    type: object
  config.ToolLs:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  config.Tools:
    properties:
      grep:
        $ref: '#/definitions/config.ToolGrep'
      ls:
        $ref: '#/definitions/config.ToolLs'
    type: object
  config.TrailerStyle:
    enum:
    - none
    - co-authored-by
    - assisted-by
    type: string
    x-enum-varnames:
    - TrailerStyleNone
    - TrailerStyleCoAuthoredBy
    - TrailerStyleAssistedBy
  config.WorktreeConfig:
    properties:
      enabled:
        description: Enabled controls whether worktrees are used (default true).
        type: boolean
      post_create:
        description: PostCreate defines commands to run after creating/restoring a
          worktree.
        items:
          $ref: '#/definitions/config.PostCreateHook'
        type: array
    type: object
  csync.Map-string-config_ProviderConfig:
    type: object
  fork.ForkParams:
    properties:
      createWorktree:
        description: CreateWorktree if true, creates a new worktree with the snapshot
          state.
        type: boolean
      messageID:
        description: |-
          MessageID is the message to fork from. The new session will include
          all messages up to and including this one.
        type: string
      sessionID:
        description: SessionID is the source session to fork from.
        type: string
      title:
        description: Title is the title for the new session. Auto-generated if empty.
        type: string
      worktreeName:
        description: WorktreeName is the name for the new worktree. Auto-generated
          if empty.
        type: string
    type: object
  github_com_taigrr_crush_internal_config.Config:
    properties:
      $schema:
        type: string
      embedding:
        $ref: '#/definitions/config.EmbeddingConfig'
      hooks:
        additionalProperties:
          items:
            $ref: '#/definitions/config.HookConfig'
          type: array
        type: object
      lsp:
        $ref: '#/definitions/config.LSPs'
      mcp:
        $ref: '#/definitions/config.MCPs'
      models:
        additionalProperties:
          $ref: '#/definitions/config.SelectedModel'
        description: |-
          Keys are "large", "small", the optional "worker", and any
          user-defined role names (see ModelRoles). Role names are the
          vocabulary the `model` parameter on the agent/review tools
          accepts, so an operator can map e.g. "scout" to a cheap model on
          one machine and a different one on another without prompts
          changing.
        type: object
      options:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Options'
      permissions:
        $ref: '#/definitions/config.Permissions'
      providers:
        allOf:
        - $ref: '#/definitions/csync.Map-string-config_ProviderConfig'
        description: The providers that are configured
      recent_models:
        additionalProperties:
          items:
            $ref: '#/definitions/config.SelectedModel'
          type: array
        description: Recently used models stored in the data directory config.
        type: object
      snapshots:
        $ref: '#/definitions/config.SnapshotsConfig'
      tools:
        $ref: '#/definitions/config.Tools'
      worktree:
        $ref: '#/definitions/config.WorktreeConfig'
    type: object
  github_com_taigrr_crush_internal_config.Options:
    properties:
      attribution:
        $ref: '#/definitions/config.Attribution'
      auto_lsp:
        type: boolean
      context_paths:
        items:
          type: string
        type: array
      data_directory:
        description: |-
          DataDirectory is where Crush keeps per-project state such as
          the SQLite database and workspace overrides. Relative paths are
          resolved against the working directory; absolute paths are used
          verbatim. After defaulting the stored value is always absolute.
        type: string
      debug:
        type: boolean
      debug_lsp:
        type: boolean
      disable_auto_summarize:
        type: boolean
      disable_default_providers:
        type: boolean
      disable_metrics:
        type: boolean
      disable_notifications:
        type: boolean
      disable_provider_auto_update:
        type: boolean
      disabled_skills:
        items:
          type: string
        type: array
      disabled_tools:
        items:
          type: string
        type: array
      initialize_as:
        type: string
      notification_style:
        type: string
      progress:
        type: boolean
      skills_paths:
        items:
          type: string
        type: array
      sound:
        $ref: '#/definitions/config.SoundOptions'
      tui:
        $ref: '#/definitions/config.TUIOptions'
    type: object
  github_com_taigrr_crush_internal_config.Scope:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - ScopeGlobal
    - ScopeWorkspace
  github_com_taigrr_crush_internal_proto.Message:
    properties:
      created_at:
        type: integer
      id:
        type: string
      model:
        type: string
      parts:
        items: {}
        type: array
      provider:
        type: string
      role:
        $ref: '#/definitions/proto.MessageRole'
      session_id:
        type: string
      updated_at:
        type: integer
    type: object
  lsp.ServerState:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    type: integer
    x-enum-varnames:
    - StateUnstarted
    - StateStarting
    - StateReady
    - StateError
    - StateStopped
    - StateDisabled
  oauth.OAuthClient:
    properties:
      auth_style:
        type: integer
      auth_url:
        type: string
      client_id:
        type: string
      client_secret:
        type: string
      token_url:
        type: string
    type: object
  oauth.Token:
    properties:
      access_token:
        type: string
      client:
        $ref: '#/definitions/oauth.OAuthClient'
      expires_at:
        type: integer
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  proto.APIKeyKind:
    enum:
    - string
    - oauth
    type: string
    x-enum-varnames:
    - APIKeyKindString
    - APIKeyKindOAuth
  proto.AgentInfo:
    properties:
      is_busy:
        type: boolean
      is_ready:
        type: boolean
      model:
        $ref: '#/definitions/catwalk.Model'
      model_cfg:
        $ref: '#/definitions/config.SelectedModel'
    type: object
  proto.AgentMessage:
    properties:
      attachments:
        items:
          $ref: '#/definitions/proto.Attachment'
        type: array
      client_id:
        description: |-
          ClientID identifies the client that initiated the turn. The
          server uses it to route per-client resources (notably the editor
          bridge) to the right client. Empty means "no specific client".
        type: string
      prompt:
        type: string
      run_id:
        type: string
      session_id:
        type: string
      steer:
        description: |-
          Steer marks a mid-turn steering message. On a busy session the
          prompt is queued as usual and the session's soft interrupt is
          raised so long-running tools that opt in (bash, job_output) wrap
          up early — returning their work as a background job rather than
          being cancelled — and the queued prompt is folded into the turn
          at the next step. Combine with an empty RunID to fold rather than
          wait for a dedicated turn. On an idle session it is a normal
          prompt.
        type: boolean
      swarm_parts:
        description: |-
          SwarmParts, when set, replaces the default TextContent user
          message with one or more [SwarmMessage] parts. Used by
          [Backend.SwarmSend] so the receiving session records
          structured sender metadata (color, animal, workspace) instead
          of a plain text prefix. The Prompt field must still be set to
          the concatenated user-visible text so downstream code that
          treats prompts as strings (queue drop notifications, run
          logs) keeps working.
        items:
          $ref: '#/definitions/proto.SwarmMessage'
        type: array
    type: object
  proto.AgentSession:
    properties:
      animal:
        type: string
      attached_clients:
        type: integer
      color:
        description: |-
          Color and Animal are the session's swarm identity (see
          [session.Session.Color] / .Animal). Empty when the session
          has not yet been backfilled; UI code should fall back to no
          address label / no color square in that case.
        type: string
      completion_tokens:
        type: integer
      cost:
        type: number
      created_at:
        type: integer
      id:
        type: string
      is_busy:
        type: boolean
      message_count:
        type: integer
      model_ref:
        description: |-
          ModelRef is the model reference the session was spawned with (see
          [session.Session.ModelRef]); empty when it runs the workspace's
          large model.
        type: string
      parent_session_id:
        type: string
      prompt_tokens:
        type: integer
      spawned_by_session_id:
        description: |-
          SpawnedBySessionID and SpawnedByWorkspaceID are the swarm lineage
          of the session (see [session.Session.SpawnedBySessionID]): the
          session that created it via `swarm new` and that spawner's
          workspace. Empty for sessions opened by a human or a client.
        type: string
      spawned_by_workspace_id:
        type: string
      summary_message_id:
        type: string
      title:
        type: string
      todos:
        items:
          $ref: '#/definitions/proto.Todo'
        type: array
      updated_at:
        type: integer
      working_dir:
        description: |-
          WorkingDir is the directory the session's tools run in (see
          [session.Session.WorkingDir]). Empty until the session's first
          run stamps it, or when the workspace's worktree system owns the
          per-session directory.
        type: string
    type: object
  proto.Attachment:
    properties:
      content:
        items:
          type: integer
        type: array
      file_name:
        type: string
      file_path:
        type: string
      mime_type:
        type: string
    type: object
  proto.ConfigCompactRequest:
    properties:
      enabled:
        type: boolean
      scope:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Scope'
    type: object
  proto.ConfigModelRequest:
    properties:
      model:
        $ref: '#/definitions/config.SelectedModel'
      model_type:
        $ref: '#/definitions/config.SelectedModelType'
      scope:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Scope'
    type: object
  proto.ConfigProviderKeyRequest:
    properties:
      api_key:
        items:
          type: integer
        type: array
      kind:
        $ref: '#/definitions/proto.APIKeyKind'
      provider_id:
        type: string
      scope:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Scope'
    type: object
  proto.ConfigRefreshOAuthRequest:
    properties:
      provider_id:
        type: string
      scope:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Scope'
    type: object
  proto.ConfigRemoveRequest:
    properties:
      key:
        type: string
      scope:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Scope'
    type: object
  proto.ConfigSetRequest:
    properties:
      key:
        type: string
      scope:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Scope'
      value: {}
    type: object
  proto.CurrentSession:
    properties:
      session_id:
        type: string
    type: object
  proto.Error:
    properties:
      code:
        description: |-
          Code, when set, identifies the condition machine-readably. See
          the ErrorCode* constants.
        type: string
      message:
        type: string
    type: object
  proto.File:
    properties:
      content:
        type: string
      created_at:
        type: integer
      id:
        type: string
      path:
        type: string
      session_id:
        type: string
      updated_at:
        type: integer
      version:
        type: integer
    type: object
  proto.FileTrackerReadRequest:
    properties:
      path:
        type: string
      session_id:
        type: string
    type: object
  proto.GoalStatus:
    properties:
      active:
        type: boolean
      condition:
        type: string
      max_turns:
        type: integer
      turns:
        type: integer
    type: object
  proto.Health:
    properties:
      active_runs:
        description: |-
          ActiveRuns is the number of sessions, across all workspaces, with
          an active or accepted-but-not-yet-active agent run. A run blocked
          on a permission or question prompt counts.
        type: integer
      draining:
        description: |-
          Draining is true once the server has been asked to drain for an
          update: it finishes in-flight runs but accepts no new ones, and
          exits on its own when ActiveRuns reaches zero.
        type: boolean
      status:
        type: string
    type: object
  proto.ImportCopilotResponse:
    properties:
      success:
        type: boolean
      token: {}
    type: object
  proto.LSPClientInfo:
    properties:
      connected_at:
        type: string
      diagnostic_count:
        type: integer
      error: {}
      name:
        type: string
      state:
        $ref: '#/definitions/lsp.ServerState'
    type: object
  proto.LSPStartRequest:
    properties:
      path:
        type: string
    type: object
  proto.MCPClientInfo:
    properties:
      connected_at:
        type: string
      error: {}
      name:
        type: string
      prompt_count:
        type: integer
      resource_count:
        type: integer
      state:
        $ref: '#/definitions/proto.MCPState'
      tool_count:
        type: integer
    type: object
  proto.MCPGetPromptRequest:
    properties:
      args:
        additionalProperties:
          type: string
        type: object
      client_id:
        type: string
      prompt_id:
        type: string
    type: object
  proto.MCPGetPromptResponse:
    properties:
      prompt:
        type: string
    type: object
  proto.MCPNameRequest:
    properties:
      name:
        type: string
    type: object
  proto.MCPReadResourceRequest:
    properties:
      name:
        type: string
      uri:
        type: string
    type: object
  proto.MCPState:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - MCPStateDisabled
    - MCPStateStarting
    - MCPStateConnected
    - MCPStateError
    - MCPStateNeedsAuth
  proto.MessageRole:
    enum:
    - assistant
    - user
    - system
    - tool
    type: string
    x-enum-varnames:
    - Assistant
    - User
    - System
    - Tool
  proto.PeekMessagesParams:
    properties:
      root:
        type: string
      session_id:
        type: string
    type: object
  proto.PeekSessionInfoResult:
    properties:
      files:
        items:
          $ref: '#/definitions/proto.File'
        type: array
      session:
        $ref: '#/definitions/proto.Session'
    type: object
  proto.PermissionAction:
    enum:
    - allow
    - allow_session
    - deny
    type: string
    x-enum-varnames:
    - PermissionAllow
    - PermissionAllowForSession
    - PermissionDeny
  proto.PermissionGrant:
    properties:
      action:
        $ref: '#/definitions/proto.PermissionAction'
      permission:
        $ref: '#/definitions/proto.PermissionRequest'
    type: object
  proto.PermissionGrantResponse:
    properties:
      resolved:
        type: boolean
    type: object
  proto.PermissionRequest:
    properties:
      action:
        type: string
      description:
        type: string
      id:
        type: string
      params: {}
      path:
        type: string
      session_id:
        type: string
      tool_call_id:
        type: string
      tool_name:
        type: string
    type: object
  proto.PermissionSkipRequest:
    properties:
      skip:
        type: boolean
    type: object
  proto.PermissionSysadminRequest:
    properties:
      sysadmin:
        type: boolean
    type: object
  proto.ProjectInitPromptResponse:
    properties:
      prompt:
        type: string
    type: object
  proto.ProjectNeedsInitResponse:
    properties:
      needs_init:
        type: boolean
    type: object
  proto.QuestionAnswer:
    properties:
      cancelled:
        type: boolean
      id:
        type: string
      selected:
        items:
          type: string
        type: array
      session_id:
        type: string
      tool_call_id:
        type: string
    type: object
  proto.QuestionAnswerResponse:
    properties:
      resolved:
        type: boolean
    type: object
  proto.ReadSkillRequest:
    properties:
      skill_id:
        type: string
    type: object
  proto.ReadSkillResponse:
    properties:
      content:
        items:
          type: integer
        type: array
      result:
        $ref: '#/definitions/proto.SkillReadResult'
    type: object
  proto.ServerControl:
    properties:
      command:
        type: string
    type: object
  proto.Session:
    properties:
      animal:
        type: string
      attached_clients:
        type: integer
      color:
        description: |-
          Color and Animal are the session's swarm identity (see
          [session.Session.Color] / .Animal). Empty when the session
          has not yet been backfilled; UI code should fall back to no
          address label / no color square in that case.
        type: string
      completion_tokens:
        type: integer
      cost:
        type: number
      created_at:
        type: integer
      id:
        type: string
      is_busy:
        type: boolean
      message_count:
        type: integer
      model_ref:
        description: |-
          ModelRef is the model reference the session was spawned with (see
          [session.Session.ModelRef]); empty when it runs the workspace's
          large model.
        type: string
      parent_session_id:
        type: string
      prompt_tokens:
        type: integer
      spawned_by_session_id:
        description: |-
          SpawnedBySessionID and SpawnedByWorkspaceID are the swarm lineage
          of the session (see [session.Session.SpawnedBySessionID]): the
          session that created it via `swarm new` and that spawner's
          workspace. Empty for sessions opened by a human or a client.
        type: string
      spawned_by_workspace_id:
        type: string
      summary_message_id:
        type: string
      title:
        type: string
      todos:
        items:
          $ref: '#/definitions/proto.Todo'
        type: array
      updated_at:
        type: integer
      working_dir:
        description: |-
          WorkingDir is the directory the session's tools run in (see
          [session.Session.WorkingDir]). Empty until the session's first
          run stamps it, or when the workspace's worktree system owns the
          per-session directory.
        type: string
    type: object
  proto.SessionOverview:
    properties:
      animal:
        type: string
      color:
        description: |-
          Color and Animal are the session's swarm identity (see
          [session.Session.Color] / .Animal). Empty when the session
          has not yet been backfilled; the picker/sidebar should fall
          back to no color square in that case.
        type: string
      favorite:
        description: |-
          Favorite pins the session to the top of the sidebar inbox (below
          sessions blocked on a permission prompt). It is read from the
          session's database (attached or detached) so it persists.
        type: boolean
      id:
        type: string
      is_busy:
        type: boolean
      spawned_by_session_id:
        description: |-
          SpawnedBySessionID is the swarm lineage of the session (see
          [session.Session.SpawnedBySessionID]): the session that created
          it via `swarm new`. Empty for human/client-opened sessions. The
          sidebar uses it to nest workers under their spawner.
        type: string
      title:
        type: string
      unread:
        type: boolean
      updated_at:
        type: integer
      working_dir:
        type: string
    type: object
  proto.SetGoalRequest:
    properties:
      condition:
        type: string
      session_id:
        type: string
    type: object
  proto.SetWorkingDirRequest:
    properties:
      working_dir:
        type: string
    type: object
  proto.ShellCommandRequest:
    properties:
      client_id:
        description: |-
          ClientID identifies the client that initiated the command so the
          server can run it in that client's launch directory. Multiple
          clients can share one workspace (subdirectories or sibling git
          worktrees collapsing to the same project root); without it the
          command would run in whichever client created the workspace first.
        type: string
      command:
        type: string
      session_id:
        type: string
    type: object
  proto.ShellCommandResponse:
    properties:
      exit_code:
        type: integer
      output:
        type: string
    type: object
  proto.SkillDiscoveryState:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - SkillStateNormal
    - SkillStateError
  proto.SkillInfo:
    properties:
      description:
        type: string
      id:
        type: string
      label:
        type: string
      name:
        type: string
      source:
        type: string
      user_invocable:
        type: boolean
    type: object
  proto.SkillReadResult:
    properties:
      builtin:
        type: boolean
      description:
        type: string
      name:
        type: string
      source:
        type: string
    type: object
  proto.SkillState:
    properties:
      error: {}
      name:
        type: string
      path:
        type: string
      state:
        $ref: '#/definitions/proto.SkillDiscoveryState'
    type: object
  proto.SwarmMessage:
    properties:
      body:
        type: string
      btw:
        type: boolean
      require_reply:
        type: boolean
      sender_animal:
        type: string
      sender_color:
        type: string
      sender_session_id:
        type: string
      sender_workspace_id:
        type: string
      text:
        type: string
    type: object
  proto.Todo:
    properties:
      active_form:
        type: string
      content:
        type: string
      status:
        type: string
    type: object
  proto.VersionInfo:
    properties:
      build_id:
        type: string
      commit:
        type: string
      go_version:
        type: string
      platform:
        type: string
      protocol_version:
        description: |-
          ProtocolVersion is the server's [ProtocolVersion]. Servers that
          predate the field report 0.
        type: integer
      version:
        type: string
    type: object
  proto.Workspace:
    properties:
      client_id:
        type: string
      config:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Config'
      data_dir:
        type: string
      debug:
        type: boolean
      env:
        items:
          type: string
        type: array
      git_branch:
        type: string
      id:
        type: string
      isolated:
        type: boolean
      path:
        type: string
      skills:
        items:
          $ref: '#/definitions/proto.SkillState'
        type: array
      version:
        type: string
      working_dir:
        type: string
      yolo:
        type: boolean
    type: object
  proto.WorkspaceOverview:
    properties:
      attached:
        type: boolean
      data_dir:
        type: string
      root:
        type: string
      sessions:
        items:
          $ref: '#/definitions/proto.SessionOverview'
        type: array
      workspace_id:
        type: string
    type: object
  server.CreateWorktreeRequest:
    properties:
      from_snapshot_id:
        type: string
      name:
        type: string
    type: object
  server.MergeWorktreeRequest:
    properties:
      rebase:
        type: boolean
      target_branch:
        type: string
    type: object
  time.Duration:
    enum:
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    format: int64
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
info:
  contact:
    name: Charm
    url: https://charm.sh
  description: Crush is a terminal-based AI coding assistant. This API is served over
    a Unix socket (or Windows named pipe) and provides programmatic access to workspaces,
    sessions, agents, LSP, MCP, and more.
  license:
    name: MIT
    url: https://github.com/taigrr/crush/blob/main/LICENSE
  title: Crush API
  version: "1.0"
paths:
  /config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get server config
      tags:
      - system
  /control:
    post:
      consumes:
      - application/json
      parameters:
      - description: Control command (e.g. shutdown)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proto.ServerControl'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Send server control command
      tags:
      - system
  /drain:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.Health'
      summary: Drain the server for an update
      tags:
      - system
  /events:
    get:
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
      summary: Stream global attention events (SSE)
      tags:
      - events
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.Health'
      summary: Health check
      tags:
      - system
  /peek-messages:
    post:
      consumes:
      - application/json
      parameters:
      - description: Target workspace root and session id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proto.PeekMessagesParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_taigrr_crush_internal_proto.Message'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proto.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Peek a session's messages in any known workspace
      tags:
      - sessions
  /peek-session-info:
    post:
      consumes:
      - application/json
      parameters:
      - description: Target workspace root and session id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proto.PeekMessagesParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.PeekSessionInfoResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proto.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Peek a session's info in any known workspace
      tags:
      - sessions
  /version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.VersionInfo'
      summary: Get server version
      tags:
      - system
  /workspace-overviews:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/proto.WorkspaceOverview'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: List workspace/session overviews
      tags:
      - workspaces
  /workspaces:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/proto.Workspace'
            type: array
      summary: List workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      parameters:
      - description: Workspace creation params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proto.Workspace'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.Workspace'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Create workspace
      tags:
      - workspaces
  /workspaces/{id}:
    delete:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Delete workspace
      tags:
      - workspaces
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.Workspace'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Get workspace
      tags:
      - workspaces
  /workspaces/{id}/agent:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.AgentInfo'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Get agent info
      tags:
      - agent
    post:
      consumes:
      - application/json
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Agent message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proto.AgentMessage'
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/proto.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Send message to agent
      tags:
      - agent
  /workspaces/{id}/agent/cancel:
    post:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Cancel all agent sessions
      tags:
      - agent
  /workspaces/{id}/agent/default-small-model:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Provider ID
        in: query
        name: provider_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Get default small model
      tags:
      - agent
  /workspaces/{id}/agent/init:
    post:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Initialize agent
      tags:
      - agent
  /workspaces/{id}/agent/sessions/{sid}:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Session ID
        in: path
        name: sid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.AgentSession'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Get agent session
      tags:
      - agent
  /workspaces/{id}/agent/sessions/{sid}/cancel:
    post:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Session ID
        in: path
        name: sid
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Cancel agent session
      tags:
      - agent
  /workspaces/{id}/agent/sessions/{sid}/cwd:
    post:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Session ID
        in: path
        name: sid
        required: true
        type: string
      - description: Working directory
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proto.SetWorkingDirRequest'
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Set session working directory
      tags:
      - agent
  /workspaces/{id}/agent/sessions/{sid}/goal:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Session ID
        in: path
        name: sid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/proto.GoalStatus'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Get goal status
      tags:
      - agent
    post:
      consumes:
      - application/json
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Session ID
        in: path
        name: sid
        required: true
        type: string
      - description: Goal
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/proto.SetGoalRequest'
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Set goal
      tags:
      - agent
  /workspaces/{id}/agent/sessions/{sid}/goal/clear:
    post:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Session ID
        in: path
        name: sid
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Clear goal
      tags:
      - agent
  /workspaces/{id}/agent/sessions/{sid}/interrupt:
    post:
      description: Ask the tools running in the session's current step to wrap up
        early without cancelling them; a running shell command becomes a background
        job.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Session ID
        in: path
        name: sid
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Soft-interrupt agent session
      tags:
      - agent
  /workspaces/{id}/agent/sessions/{sid}/prompts/clear:
    post:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Session ID
        in: path
        name: sid
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Clear prompt queue
      tags:
      - agent
  /workspaces/{id}/agent/sessions/{sid}/prompts/list:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Session ID
        in: path
        name: sid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/proto.Error'
      summary: List queued prompts
      tags:
      - agent
  /workspaces/{id}/agent/sessions/{sid}/prompts/queued:
