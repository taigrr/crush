        type: string
      session_id:
        type: string
      tool_call_id:
        type: string
    type: object
  proto.ReadSkillRequest:
    properties:
      skill_id:
        type: string
    type: object
  proto.ReadSkillResponse:
    properties:
      content:
        items:
          type: integer
        type: array
      result:
        $ref: '#/definitions/proto.SkillReadResult'
    type: object
  proto.SearchHistoryParams:
    properties:
      all_workspaces:
        description: |-
          AllWorkspaces opts into cross-workspace fan-out: when true the
          backend also searches every other known workspace (attached and
          registry-detached) and merges the results. When false (the
          default) only the requested workspace is searched — the fast path.
        type: boolean
      limit:
        type: integer
      offset:
        description: |-
          Offset is reserved: session-level pagination is not yet supported
          (results collapse per session after a message-level candidate
          fetch, so a message offset would not align to session boundaries).
          It is currently ignored by the backend.
        type: integer
      query:
        type: string
      scope:
        type: string
      semantic:
        type: boolean
    type: object
  proto.SearchHistoryResult:
    properties:
      fallback_reason:
        description: |-
          FallbackReason says why Mode is "text": no_embedder,
          disabled_by_request, disabled_by_config, no_embeddings, or
          embed_error.
        enum:
        - no_embedder
        - disabled_by_request
        - disabled_by_config
        - no_embeddings
        - embed_error
        type: string
      hits:
        items:
          $ref: '#/definitions/proto.SessionHit'
        type: array
      mode:
        description: |-
          Mode is the search mode actually used: "hybrid" (substring and
          vector signals fused) or "text" (substring only).
        enum:
        - hybrid
        - text
        type: string
      semantic_used:
        description: |-
          SemanticUsed reports whether the vector signal ran without error.
          Kept for older clients; prefer Mode.
        type: boolean
      total:
        type: integer
    type: object
  proto.ServerConfig:
    properties:
      configured:
        description: Configured reports whether at least one AI provider is enabled.
        type: boolean
    type: object
  proto.ServerControl:
    properties:
      command:
        type: string
    type: object
  proto.Session:
    properties:
      animal:
        type: string
      attached_clients:
        type: integer
      color:
        description: |-
          Color and Animal are the session's swarm identity (see
          [session.Session.Color] / .Animal). Empty when the session
          has not yet been backfilled; UI code should fall back to no
          address label / no color square in that case.
        type: string
      completion_tokens:
        type: integer
      cost:
        type: number
      created_at:
        type: integer
      id:
        type: string
      is_busy:
        type: boolean
      message_count:
        type: integer
      model_ref:
        description: |-
          ModelRef is the model reference the session was spawned with (see
          [session.Session.ModelRef]); empty when it runs the workspace's
          large model.
        type: string
      owner_node:
        description: |-
          OwnerNode is the cluster node that owns the session (empty = the
          server answering).
        type: string
      parent_session_id:
        type: string
      prompt_tokens:
        type: integer
      summary_message_id:
        type: string
      title:
        type: string
      todos:
        items:
          $ref: '#/definitions/proto.Todo'
        type: array
      updated_at:
        type: integer
    type: object
  proto.SessionBatchRequest:
    properties:
      op:
        type: string
      targets:
        items:
          $ref: '#/definitions/proto.SessionBatchTarget'
        type: array
    type: object
  proto.SessionBatchResult:
    properties:
      failed:
        additionalProperties:
          type: string
        type: object
    type: object
  proto.SessionBatchTarget:
    properties:
      root:
        type: string
      session_id:
        type: string
      workspace_id:
        type: string
    type: object
  proto.SessionBundle:
    properties:
      children:
        additionalProperties:
          items:
            $ref: '#/definitions/github_com_taigrr_crush_internal_proto.Message'
          type: array
        type: object
      files:
        items:
          $ref: '#/definitions/proto.File'
        type: array
      messages:
        items:
          $ref: '#/definitions/github_com_taigrr_crush_internal_proto.Message'
        type: array
      read_files:
        items:
          type: string
        type: array
      session:
        $ref: '#/definitions/proto.Session'
    type: object
  proto.SessionBundleParams:
    properties:
      root:
        type: string
      session_id:
        type: string
      workspace_id:
        type: string
    type: object
  proto.SessionHit:
    properties:
      created_at:
        type: string
      match:
        type: string
      message_id:
        type: string
      role:
        type: string
      score:
        type: number
      session_id:
        type: string
      session_title:
        type: string
      snippet:
        type: string
      workspace_id:
        type: string
      workspace_root:
        type: string
    type: object
  proto.SessionModel:
    properties:
      default:
        description: |-
          Default reports that the session follows the workspace's large
          model (no ModelRef, or one that no longer resolves).
        type: boolean
      large:
        allOf:
        - $ref: '#/definitions/config.SelectedModel'
        description: |-
          Large is the model the session's top-level turns run on: the
          resolved ModelRef, else the workspace's large model.
      model_ref:
        description: |-
          ModelRef is the session's own model reference; empty when the
          session follows the workspace's large model.
        type: string
      small:
        allOf:
        - $ref: '#/definitions/config.SelectedModel'
        description: |-
          Small is the model used for the session's titles and summaries. It
          is always the workspace's small model.
    type: object
  proto.SessionModelRequest:
    properties:
      model:
        allOf:
        - $ref: '#/definitions/config.SelectedModel'
        description: Model selects a provider and model explicitly.
      model_ref:
        description: ModelRef is a role name, "provider/model", or a bare model id.
        type: string
      model_type:
        allOf:
        - $ref: '#/definitions/config.SelectedModelType'
        description: |-
          ModelType is the slot to set; only "large" (the default) is
          per-session.
    type: object
  proto.SessionOverview:
    properties:
      animal:
        type: string
      color:
        description: |-
          Color and Animal are the session's swarm identity (see
          [session.Session.Color] / .Animal). Empty when the session
          has not yet been backfilled; the picker/sidebar should fall
          back to no color square in that case.
        type: string
      favorite:
        description: |-
          Favorite pins the session to the top of the sidebar inbox (below
          sessions blocked on a permission prompt). It is read from the
          session's database (attached or detached) so it persists.
        type: boolean
      id:
        type: string
      is_busy:
        type: boolean
      owner_name:
        type: string
      owner_node:
        description: |-
          OwnerNode is the cluster node that owns (may write) the session; ""
          means the node that produced this overview. OwnerName is its
          display name. ReadOnly marks a replica shown because its owner is
          unreachable.
        type: string
      owner_unreachable_since:
        type: integer
      read_only:
        type: boolean
      replica_reason:
        description: |-
          ReplicaReason explains a ReadOnly replica, e.g. "owner unreachable:
          context deadline exceeded". OwnerUnreachableSince is when this node
          started failing to reach the owner (unix ms; 0 if unknown).
        type: string
      title:
        type: string
      unread:
        type: boolean
      updated_at:
        type: integer
      working_dir:
        type: string
    type: object
  proto.SessionTombstone:
    properties:
      id:
        type: string
      node_id:
        type: string
      root:
        type: string
    type: object
  proto.SetGoalRequest:
    properties:
      condition:
        type: string
      session_id:
        type: string
    type: object
  proto.SetWorkingDirRequest:
    properties:
      working_dir:
        type: string
    type: object
  proto.ShellCommandRequest:
    properties:
      client_id:
        description: |-
          ClientID identifies the client that initiated the command so the
          server can run it in that client's launch directory. Multiple
          clients can share one workspace (subdirectories or sibling git
          worktrees collapsing to the same project root); without it the
          command would run in whichever client created the workspace first.
        type: string
      command:
        type: string
      session_id:
        type: string
    type: object
  proto.ShellCommandResponse:
    properties:
      exit_code:
        type: integer
      output:
        type: string
    type: object
  proto.SkillDiscoveryState:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - SkillStateNormal
    - SkillStateError
  proto.SkillInfo:
    properties:
      description:
        type: string
      id:
        type: string
      label:
        type: string
      name:
        type: string
      source:
        type: string
      user_invocable:
        type: boolean
    type: object
  proto.SkillReadResult:
    properties:
      builtin:
        type: boolean
      description:
        type: string
      name:
        type: string
      source:
        type: string
    type: object
  proto.SkillState:
    properties:
      error: {}
      name:
        type: string
      path:
        type: string
      state:
        $ref: '#/definitions/proto.SkillDiscoveryState'
    type: object
  proto.SwarmMessage:
    properties:
      body:
        type: string
      btw:
        type: boolean
      sender_animal:
        type: string
      sender_color:
        type: string
      sender_session_id:
        type: string
      sender_workspace_id:
        type: string
      text:
        type: string
    type: object
  proto.SwarmTarget:
    properties:
      address:
        type: string
      path:
        description: |-
          Path is the workspace's project root; clients connect to it to
          operate on the session.
        type: string
      session_id:
        type: string
      workspace_id:
        type: string
    type: object
  proto.Todo:
    properties:
      active_form:
        type: string
      content:
        type: string
      status:
        type: string
    type: object
  proto.VersionInfo:
    properties:
      build_id:
        type: string
      commit:
        type: string
      go_version:
        type: string
      persistent:
        description: |-
          Persistent is true when the server runs as a daemon that does not
          exit after its last workspace closes.
        type: boolean
      platform:
        type: string
      protocol:
        type: integer
      version:
        type: string
    type: object
  proto.VoiceClientSecret:
    properties:
      expires_at:
        description: ExpiresAt is the secret's expiry in unix seconds.
        type: integer
      value:
        type: string
    type: object
  proto.VoiceClientSecretRequest:
    properties:
      session_id:
        type: string
    type: object
  proto.Workspace:
    properties:
      client_id:
        type: string
      config:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Config'
      data_dir:
        type: string
      debug:
        type: boolean
      env:
        items:
          type: string
        type: array
      git_branch:
        type: string
      id:
        type: string
      isolated:
        type: boolean
      path:
        type: string
      skills:
        items:
          $ref: '#/definitions/proto.SkillState'
        type: array
      version:
        type: string
      working_dir:
        type: string
      yolo:
        type: boolean
    type: object
  proto.WorkspaceOverview:
    properties:
      attached:
        type: boolean
      data_dir:
        type: string
      error:
        type: string
      last_error:
        type: string
      node_id:
        description: |-
          NodeID and NodeName identify the cluster node that owns the
          workspace. Empty means the server answering the request.
        type: string
      node_name:
        type: string
      root:
        type: string
      sessions:
        items:
          $ref: '#/definitions/proto.SessionOverview'
        type: array
      stale:
        description: |-
          Stale marks a remote node's last good overview served because the
          latest refresh failed; StaleSince is when it was fetched (unix ms)
          and LastError why the refresh failed. On a node-level Unavailable
          marker StaleSince is the last successful fetch, if any.
        type: boolean
      stale_since:
        type: integer
      unavailable:
        description: |-
          Unavailable marks a workspace (or, with an empty Root, a whole
          cluster node) whose sessions could not be read in time; Error says
          why. Sessions is then empty or a stale subset.
        type: boolean
      workspace_id:
        type: string
    type: object
  proto.WorkspaceRoot:
    properties:
      attached:
        type: boolean
      data_dir:
        type: string
      last_used_at:
        type: integer
      root:
        type: string
      session_count:
        type: integer
      workspace_id:
        type: string
    type: object
  proto.WorkspaceRoots:
    properties:
      roots:
        items:
          $ref: '#/definitions/proto.WorkspaceRoot'
        type: array
    type: object
  server.CreateWorktreeRequest:
    properties:
      from_snapshot_id:
        type: string
      name:
        type: string
    type: object
  server.MergeWorktreeRequest:
    properties:
      rebase:
        type: boolean
      target_branch:
        type: string
    type: object
  time.Duration:
    enum:
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    format: int64
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
  transfer.ConflictPolicy:
    enum:
    - ""
    - backup
    - keep
    type: string
    x-enum-varnames:
    - ConflictRefuse
    - ConflictBackup
    - ConflictKeep
  transfer.Plan:
    enum:
    - fresh
    - overlay
    - backup
    - db-only
    type: string
    x-enum-varnames:
    - PlanFresh
    - PlanOverlay
    - PlanBackup
    - PlanDBOnly
info:
  contact:
    name: Charm
    url: https://charm.sh
  description: Crush is a terminal-based AI coding assistant. This API is served over
    a Unix socket (or Windows named pipe) and provides programmatic access to workspaces,
    sessions, agents, LSP, MCP, and more.
  license:
    name: MIT
    url: https://github.com/taigrr/crush/blob/main/LICENSE
  title: Crush API
  version: "1.0"
paths:
  /client/v1/info:
    get:
      description: Device client listener (TLS, default :7733); the path is absolute,
        not under the /v1 base path.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pairing.Info'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pairing.Error'
      summary: Client node info
      tags:
      - client
      x-crush-scope: never
  /client/v1/pair/abort:
    post:
      consumes:
      - application/json
      description: Device client listener (TLS, default :7733); the path is absolute,
        not under the /v1 base path.
      parameters:
      - description: Abort
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pairing.AbortRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pairing.StateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pairing.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pairing.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/pairing.Error'
      summary: Abort pairing
      tags:
      - client
      x-crush-scope: never
  /client/v1/pair/claim:
    post:
      consumes:
      - application/json
      description: Device client listener (TLS, default :7733); the path is absolute,
        not under the /v1 base path.
      parameters:
      - description: Claim
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pairing.ClaimRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pairing.ClaimResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pairing.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pairing.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pairing.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/pairing.Error'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/pairing.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/pairing.Error'
      summary: Claim a pairing offer
      tags:
      - client
      x-crush-scope: never
  /client/v1/pair/confirm:
    post:
      consumes:
      - application/json
      description: Device client listener (TLS, default :7733); the path is absolute,
        not under the /v1 base path.
      parameters:
      - description: Confirm
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pairing.ConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pairing.StateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pairing.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pairing.Error'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/pairing.Error'
      summary: Confirm the SAS
      tags:
      - client
      x-crush-scope: never
  /client/v1/pair/poll:
    post:
      consumes:
      - application/json
      description: Device client listener (TLS, default :7733); the path is absolute,
        not under the /v1 base path.
      parameters:
      - description: Poll
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pairing.PollRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pairing.PollResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pairing.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pairing.Error'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/pairing.Error'
      summary: Poll the pairing outcome
      tags:
      - client
      x-crush-scope: never
  /cluster:
    get:
      produces:
      - application/json
      responses: {}
      summary: Cluster status
      tags:
      - cluster
      x-crush-scope: never
  /cluster/approve:
    post:
      produces:
      - application/json
      responses: {}
      summary: Approve a node join request
      tags:
      - cluster
      x-crush-scope: never
  /cluster/dashboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/cluster.NodeDashboard'
            type: array
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Cluster dashboard
      tags:
      - cluster
      x-crush-scope: sessions:read
  /cluster/deny:
    post:
      produces:
      - application/json
      responses: {}
      summary: Deny a node join request
      tags:
      - cluster
      x-crush-scope: never
  /cluster/devices:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/pairing.Device'
            type: array
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/proto.Error'
      summary: List paired devices
      tags:
      - devices
      x-crush-scope: never
  /cluster/devices/{device_id}/revoke:
    post:
      parameters:
      - description: Device ID
        in: path
        name: device_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pairing.Device'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/proto.Error'
      summary: Revoke a paired device
      tags:
      - devices
      x-crush-scope: never
  /cluster/init:
    post:
      produces:
      - application/json
      responses: {}
      summary: Create a cluster
      tags:
      - cluster
      x-crush-scope: never
  /cluster/join:
    post:
      produces:
      - application/json
      responses: {}
      summary: Join a cluster
      tags:
      - cluster
      x-crush-scope: never
  /cluster/leave:
    post:
      produces:
      - application/json
      responses: {}
      summary: Leave the cluster
      tags:
      - cluster
      x-crush-scope: never
  /cluster/name:
    post:
      produces:
      - application/json
      responses: {}
      summary: Rename this node
      tags:
      - cluster
      x-crush-scope: never
  /cluster/pairing/accept:
    post:
      consumes:
      - application/json
      parameters:
      - description: Code or payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pairing.AcceptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pairing.OfferView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pairing.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/pairing.Error'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/pairing.Error'
      summary: Accept a device pairing code
      tags:
      - pairing
      x-crush-scope: never
  /cluster/pairing/offers:
    post:
      consumes:
      - application/json
      parameters:
      - description: Offer options
        in: body
        name: request
        schema:
          $ref: '#/definitions/pairing.CreateOfferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pairing.OfferView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pairing.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/pairing.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/pairing.Error'
      summary: Create a pairing offer
      tags:
      - pairing
      x-crush-scope: never
  /cluster/pairing/offers/{offer_id}:
    get:
      parameters:
      - description: Offer ID (base64url)
        in: path
        name: offer_id
        required: true
        type: string
      - description: Wait until the state differs from this
        in: query
        name: state
        type: string
      - description: Maximum wait (≤ 30000)
        in: query
        name: wait_ms
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pairing.OfferView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pairing.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pairing.Error'
      summary: Get a pairing offer
      tags:
      - pairing
      x-crush-scope: never
  /cluster/pairing/offers/{offer_id}/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Offer ID (base64url)
