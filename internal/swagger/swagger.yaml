basePath: /v1
definitions:
  catwalk.ImageLimits:
    properties:
      max_aggregate_bytes:
        type: integer
      max_aggregate_pixels:
        type: integer
      max_bytes_per_image:
        type: integer
      max_images:
        type: integer
      max_long_edge:
        type: integer
    type: object
  catwalk.Model:
    properties:
      can_reason:
        type: boolean
      context_window:
        type: integer
      cost_per_1m_in:
        type: number
      cost_per_1m_in_cached:
        type: number
      cost_per_1m_out:
        type: number
      cost_per_1m_out_cached:
        type: number
      default_max_tokens:
        type: integer
      default_reasoning_effort:
        type: string
      dimensions:
        description: |-
          Dimensions is the size of the output vector for embedding models.
          For embedding models that support multiple output sizes this is the
          default/recommended dimensionality. It is zero for chat models.
        type: integer
      id:
        type: string
      image:
        allOf:
        - $ref: '#/definitions/catwalk.ImageLimits'
        description: |-
          Image holds per-model image-input constraints. When zero, callers
          should resolve the provider-family defaults via
          [Model.ResolveImageLimits]; non-zero fields override those
          defaults (e.g. newer Claude models that allow a larger long edge).
      long_context_cost_per_1m_in:
        description: |-
          Long context pricing (when >200K input tokens with 1M context enabled).
          These are the premium rates; standard rates are in the CostPer1M* fields above.
        type: number
      long_context_cost_per_1m_in_cached:
        type: number
      long_context_cost_per_1m_out:
        type: number
      name:
        type: string
      options:
        $ref: '#/definitions/catwalk.ModelOptions'
      reasoning_levels:
        items:
          type: string
        type: array
      supports_1m_context:
        description: Supports1MContext indicates the model supports the 1M context
          window beta feature.
        type: boolean
      supports_attachments:
        type: boolean
    type: object
  catwalk.ModelOptions:
    properties:
      frequency_penalty:
        type: number
      presence_penalty:
        type: number
      provider_options:
        additionalProperties: {}
        type: object
      temperature:
        type: number
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  cluster.AddrKind:
    enum:
    - lan
    - wireguard
    - tailscale
    - vpn
    - bridge
    - public
    - override
    type: string
    x-enum-varnames:
    - KindLAN
    - KindWireGuard
    - KindTailscale
    - KindVPN
    - KindBridge
    - KindPublic
    - KindOverride
  cluster.AdvertisedEndpoint:
    properties:
      addr:
        type: string
      kind:
        $ref: '#/definitions/cluster.AddrKind'
      priority:
        type: integer
    type: object
  cluster.DeviceEndpoints:
    properties:
      client:
        $ref: '#/definitions/cluster.DeviceListener'
      seq:
        description: |-
          Seq increases with every advertisement from the member; an older or
          equal Seq never replaces a stored record.
        type: integer
      v:
        type: integer
      ws:
        $ref: '#/definitions/cluster.DeviceListener'
    type: object
  cluster.DeviceListener:
    properties:
      addrs:
        description: |-
          Addrs are host:port pairs built from the bound listener address: a
          specific bind is its own host only, a wildcard bind every direct
          endpoint host of the member.
        items:
          type: string
        type: array
      endpoints:
        description: |-
          Endpoints are Addrs classified by the advertising member, which
          knows its own interfaces (additive: older members omit it).
        items:
          $ref: '#/definitions/cluster.AdvertisedEndpoint'
        type: array
      state:
        $ref: '#/definitions/cluster.DeviceListenerState'
    type: object
  cluster.DeviceListenerState:
    enum:
    - "on"
    - idle
    - "off"
    type: string
    x-enum-varnames:
    - DeviceListenerOn
    - DeviceListenerIdle
    - DeviceListenerOff
  cluster.Endpoint:
    properties:
      addr:
        type: string
      kind:
        $ref: '#/definitions/cluster.EndpointKind'
    type: object
  cluster.EndpointKind:
    enum:
    - nats
    - direct
    type: string
    x-enum-varnames:
    - EndpointNATS
    - EndpointDirect
  cluster.Member:
    properties:
      device:
        allOf:
        - $ref: '#/definitions/cluster.DeviceEndpoints'
        description: |-
          Device is the member's own advertisement of its device listeners
          (nil: the member predates advertising).
      endpoints:
        items:
          $ref: '#/definitions/cluster.Endpoint'
        type: array
      joined_at:
        type: string
      last_seen:
        type: string
      name:
        type: string
      node_id:
        type: string
      public_key:
        items:
          type: integer
        type: array
      version:
        type: string
    type: object
  cluster.NodeDashboard:
    properties:
      last_seen:
        type: string
      member:
        $ref: '#/definitions/cluster.Member'
      online:
        type: boolean
      rtt_ms:
        description: RTTMillis is the last mesh round-trip time; -1 when unknown.
        type: integer
      self:
        type: boolean
      stats:
        $ref: '#/definitions/cluster.NodeStats'
    type: object
  cluster.NodeJob:
    properties:
      animal:
        type: string
      blocked:
        type: boolean
      color:
        type: string
      session_id:
        type: string
      title:
        type: string
      workspace_root:
        type: string
    type: object
  cluster.NodeStats:
    properties:
      cpu_cores:
        type: integer
      cpu_percent:
        type: number
      disk_free:
        type: integer
      disk_path:
        type: string
      disk_percent:
        type: number
      disk_total:
        type: integer
      hostname:
        type: string
      jobs:
        items:
          $ref: '#/definitions/cluster.NodeJob'
        type: array
      load1:
        type: number
      load5:
        type: number
      load15:
        type: number
      mem_available:
        type: integer
      mem_percent:
        type: number
      mem_total:
        type: integer
      name:
        type: string
      node_id:
        type: string
      platform:
        type: string
      sampled_at:
        type: string
      sessions:
        type: integer
      uptime_seconds:
        type: integer
      version:
        type: string
      workspaces:
        type: integer
    type: object
  config.Attribution:
    properties:
      co_authored_by:
        type: boolean
      trailer_style:
        $ref: '#/definitions/config.TrailerStyle'
    type: object
  config.ClusterConfig:
    properties:
      autobalance:
        description: |-
          Autobalance moves each new `crush run` job to the least loaded
          online node before its first turn starts.
        type: boolean
      autobalance_margin:
        description: |-
          AutobalanceMargin is how much better (on a 0-1 load score) another
          node must be before a job moves; nil uses the default.
        type: number
    type: object
  config.Completions:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  config.EmbeddingConfig:
    properties:
      dimensions:
        description: |-
          Dimensions optionally requests a specific output dimensionality for
          models that support it. Zero means the model default.
        type: integer
      hybrid_search:
        description: |-
          HybridSearch controls whether search surfaces fuse the semantic
          (vector) signal with substring matching. Nil means the default
          (true when an embedder is configured). When false, search is pure
          substring and no query embeddings are computed. Toggling this does
          NOT invalidate stored vectors (it is not part of the signature).
        type: boolean
      model:
        description: Model is the embedding model id as used by the provider API.
        type: string
      normalize:
        description: |-
          Normalize requests unit-normalized vectors (so cosine reduces to a
          dot product) for models that support it.
        type: boolean
      provider:
        description: |-
          Provider is the provider id, matching a key in the providers
          config (same semantics as SelectedModel.Provider).
        type: string
    type: object
  config.HookConfig:
    properties:
      command:
        description: Shell command to execute.
        type: string
      matcher:
        description: Regex pattern tested against the tool name. Empty means match
          all.
        type: string
      timeout:
        description: Timeout in seconds. Default 30.
        type: integer
    type: object
  config.LSPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      filetypes:
        items:
          type: string
        type: array
      init_options:
        additionalProperties: {}
        type: object
      options:
        additionalProperties: {}
        type: object
      root_markers:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  config.LSPs:
    additionalProperties:
      $ref: '#/definitions/config.LSPConfig'
    type: object
  config.MCPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      disabled_tools:
        items:
          type: string
        type: array
      enabled_tools:
        items:
          type: string
        type: array
      env:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers are HTTP headers for HTTP/SSE MCP servers. Values run
          through shell expansion at MCP startup, so $VAR and $(cmd)
          work. A header whose value resolves to the empty string (unset
          bare $VAR under lenient nounset, $(echo), or literal "") is
          omitted from the outgoing request rather than sent as
          "Header:".
        type: object
      oauth:
        description: |-
          OAuth enables the MCP OAuth 2.1 authorization flow for HTTP
          transport servers. When true, the client uses dynamic client
          registration and opens a browser for the user to authorize.
          Tokens are persisted automatically. Only supported for type=http.
        type: boolean
      oauth_callback_port:
        description: |-
          OAuthCallbackPort pins the localhost port used for the OAuth
          redirect listener. Set this when the OAuth provider requires an
          exact-match callback URL (e.g. GitHub OAuth Apps). When omitted,
          Crush picks the first free port from its default range.
        type: integer
      oauth_client_id:
        description: |-
          OAuthClientID is an optional pre-registered OAuth client ID. Set
          it for servers that do not support dynamic client registration
          (e.g. GitHub, Slack) and instead issue client credentials when you
          register an OAuth app. Values run through shell expansion, so
          $VAR and $(cmd) work.
        type: string
      oauth_client_secret:
        description: |-
          OAuthClientSecret is the optional secret paired with
          OAuthClientID for confidential clients. Values run through shell
          expansion, so $VAR and $(cmd) work.
        type: string
      oauth_token:
        allOf:
        - $ref: '#/definitions/oauth.Token'
        description: |-
          OAuthToken is the persisted OAuth token for this server. It is
          managed internally and stored in the global data config.
      timeout:
        type: integer
      type:
        $ref: '#/definitions/config.MCPType'
      url:
        type: string
    type: object
  config.MCPType:
    enum:
    - stdio
    - sse
    - http
    type: string
    x-enum-varnames:
    - MCPStdio
    - MCPSSE
    - MCPHttp
  config.MCPs:
    additionalProperties:
      $ref: '#/definitions/config.MCPConfig'
    type: object
  config.Permissions:
    properties:
      allowed_tools:
        items:
          type: string
        type: array
    type: object
  config.PostCreateHook:
    properties:
      if_exists:
        description: IfExists is a file to check for before running the command.
        type: string
      run:
        description: Run is the command to execute.
        type: string
    type: object
  config.SelectedModel:
    properties:
      frequency_penalty:
        type: number
      max_tokens:
        description: Overrides the default model configuration.
        type: integer
      model:
        description: |-
          The model id as used by the provider API.
          Required.
        type: string
      presence_penalty:
        type: number
      provider:
        description: |-
          The model provider, same as the key/id used in the providers config.
          Required.
        type: string
      provider_options:
        additionalProperties: {}
        description: Override provider specific options.
        type: object
      reasoning_effort:
        description: Only used by models that use the openai provider and need this
          set.
        type: string
      temperature:
        type: number
      think:
        description: Used by anthropic models that can reason to indicate if the model
          should think.
        type: boolean
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  config.SelectedModelType:
    enum:
    - large
    - small
    - worker
    type: string
    x-enum-varnames:
    - SelectedModelTypeLarge
    - SelectedModelTypeSmall
    - SelectedModelTypeWorker
  config.SnapshotsConfig:
    properties:
      enabled:
        description: Enabled enables automatic snapshots on user messages.
        type: boolean
      exclude:
        description: Exclude is a list of glob patterns to exclude from snapshots.
        items:
          type: string
        type: array
    type: object
  config.SoundEvent:
    properties:
      disabled:
        type: boolean
      path:
        type: string
    type: object
  config.SoundOptions:
    properties:
      blocked:
        $ref: '#/definitions/config.SoundEvent'
      disabled:
        type: boolean
      end_of_turn:
        $ref: '#/definitions/config.SoundEvent'
      queued:
        $ref: '#/definitions/config.SoundEvent'
      swarm:
        $ref: '#/definitions/config.SoundEvent'
      tool_error:
        $ref: '#/definitions/config.SoundEvent'
    type: object
  config.TUIOptions:
    properties:
      compact_mode:
        type: boolean
      completions:
        $ref: '#/definitions/config.Completions'
      diff_mode:
        type: string
      low_bandwidth:
        description: |-
          LowBandwidth, when true, swaps the animated spinner for a simple
          "Generating .", "..", "..." cycle, halves the renderer FPS, and
          disables the session-title reveal animation. Useful over slow
          links or when the user wants reduced motion. Toggleable from the
          command palette and forced on by the CRUSH_LOW_BANDWIDTH env var.
        type: boolean
      sessions_sidebar_width:
        description: |-
          SessionsSidebarWidth is the width in columns of the left session
          navigator, persisted so a resize survives restarts. Zero means use
          the built-in default.
        type: integer
      theme:
        description: |-
          Theme selects the UI color theme by name. Builtin themes ("charmtone",
          "hypercrush") and user themes from $config/crush/themes/*.lua are
          supported. Local config overrides global, so a theme can be set
          per-workspace. Empty falls back to the provider-derived default.
        type: string
      transparent:
        type: boolean
    type: object
  config.ToolGrep:
    properties:
      timeout:
        $ref: '#/definitions/time.Duration'
    type: object
  config.ToolLs:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  config.Tools:
    properties:
      grep:
        $ref: '#/definitions/config.ToolGrep'
      ls:
        $ref: '#/definitions/config.ToolLs'
    type: object
  config.TrailerStyle:
    enum:
    - none
    - co-authored-by
    - assisted-by
    type: string
    x-enum-varnames:
    - TrailerStyleNone
    - TrailerStyleCoAuthoredBy
    - TrailerStyleAssistedBy
  config.VoiceOptions:
    properties:
      api_key:
        description: |-
          APIKey is the xAI API key used to mint ephemeral voice secrets. It
          is shell-expanded at request time ($XAI_API_KEY, $(cmd)). When
          empty, XAI_API_KEY, then the Grok OAuth login, then the xai or
          grok provider api_key are used.
        type: string
      base_url:
        description: BaseURL overrides the xAI API base URL.
        type: string
    type: object
  config.WorktreeConfig:
    properties:
      enabled:
        description: Enabled controls whether worktrees are used (default true).
        type: boolean
      post_create:
        description: PostCreate defines commands to run after creating/restoring a
          worktree.
        items:
          $ref: '#/definitions/config.PostCreateHook'
        type: array
    type: object
  csync.Map-string-config_ProviderConfig:
    type: object
  fork.ForkParams:
    properties:
      createWorktree:
        description: CreateWorktree if true, creates a new worktree with the snapshot
          state.
        type: boolean
      messageID:
        description: |-
          MessageID is the message to fork from. The new session will include
          all messages up to and including this one.
        type: string
      sessionID:
        description: SessionID is the source session to fork from.
        type: string
      title:
        description: Title is the title for the new session. Auto-generated if empty.
        type: string
      worktreeName:
        description: WorktreeName is the name for the new worktree. Auto-generated
          if empty.
        type: string
    type: object
  github_com_taigrr_crush_internal_config.Config:
    properties:
      $schema:
        type: string
      cluster:
        $ref: '#/definitions/config.ClusterConfig'
      embedding:
        $ref: '#/definitions/config.EmbeddingConfig'
      hooks:
        additionalProperties:
          items:
            $ref: '#/definitions/config.HookConfig'
          type: array
        type: object
      lsp:
        $ref: '#/definitions/config.LSPs'
      mcp:
        $ref: '#/definitions/config.MCPs'
      models:
        additionalProperties:
          $ref: '#/definitions/config.SelectedModel'
        description: |-
          Keys are "large", "small", the optional "worker", and any
          user-defined role names (see ModelRoles). Role names are the
          vocabulary the `model` parameter on the agent/review tools
          accepts, so an operator can map e.g. "scout" to a cheap model on
          one machine and a different one on another without prompts
          changing.
        type: object
      options:
        $ref: '#/definitions/github_com_taigrr_crush_internal_config.Options'
      permissions:
        $ref: '#/definitions/config.Permissions'
      providers:
        allOf:
        - $ref: '#/definitions/csync.Map-string-config_ProviderConfig'
        description: The providers that are configured
      recent_models:
        additionalProperties:
          items:
            $ref: '#/definitions/config.SelectedModel'
          type: array
        description: Recently used models stored in the data directory config.
        type: object
      snapshots:
        $ref: '#/definitions/config.SnapshotsConfig'
      tools:
        $ref: '#/definitions/config.Tools'
      worktree:
        $ref: '#/definitions/config.WorktreeConfig'
    type: object
  github_com_taigrr_crush_internal_config.Options:
    properties:
      attribution:
        $ref: '#/definitions/config.Attribution'
      auto_lsp:
        type: boolean
      context_paths:
        items:
          type: string
        type: array
      data_directory:
        description: |-
          DataDirectory is where Crush keeps per-project state such as
          the SQLite database and workspace overrides. Relative paths are
          resolved against the working directory; absolute paths are used
          verbatim. After defaulting the stored value is always absolute.
        type: string
      debug:
        type: boolean
      debug_lsp:
        type: boolean
      disable_auto_summarize:
        type: boolean
      disable_default_providers:
        type: boolean
      disable_metrics:
        type: boolean
      disable_notifications:
        type: boolean
      disable_provider_auto_update:
        type: boolean
      disabled_skills:
        items:
          type: string
        type: array
      disabled_tools:
        items:
          type: string
        type: array
      initialize_as:
        type: string
      notification_style:
        type: string
      progress:
        type: boolean
      skills_paths:
        items:
          type: string
        type: array
      sound:
        $ref: '#/definitions/config.SoundOptions'
      tui:
        $ref: '#/definitions/config.TUIOptions'
      voice:
        $ref: '#/definitions/config.VoiceOptions'
    type: object
  github_com_taigrr_crush_internal_config.Scope:
    enum:
    - 0
    - 1
    type: integer
    x-enum-varnames:
    - ScopeGlobal
    - ScopeWorkspace
  github_com_taigrr_crush_internal_proto.Message:
    properties:
      created_at:
        type: integer
      id:
        type: string
      model:
        type: string
      parts:
        items: {}
        type: array
      provider:
        type: string
      role:
        $ref: '#/definitions/proto.MessageRole'
      session_id:
        type: string
      updated_at:
        type: integer
    type: object
  lsp.DiagnosticCounts:
    properties:
      error:
        type: integer
      hint:
        type: integer
      information:
        type: integer
      warning:
        type: integer
    type: object
  lsp.ServerState:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    type: integer
    x-enum-varnames:
    - StateUnstarted
    - StateStarting
    - StateReady
    - StateError
    - StateStopped
    - StateDisabled
    - StateWarn
  milestone.Milestone:
    properties:
      createdAt:
        format: int64
        type: integer
      fullSummary:
        description: 2-3 sentence summary.
        type: string
      id:
        type: string
      sessionID:
        type: string
      shortSummary:
        description: 5-8 word summary.
        type: string
      turnNumber:
        format: int64
        type: integer
    type: object
  oauth.OAuthClient:
    properties:
      auth_style:
        type: integer
      auth_url:
        type: string
      client_id:
        type: string
      client_secret:
        type: string
      token_url:
        type: string
    type: object
  oauth.Token:
    properties:
      access_token:
        type: string
      client:
        $ref: '#/definitions/oauth.OAuthClient'
      expires_at:
        type: integer
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  pairing.AbortRequest:
    properties:
      mac:
        type: string
      offer_id:
        type: string
      reason:
        enum:
        - sas_mismatch
        - user_cancel
        type: string
    type: object
  pairing.AcceptRequest:
    properties:
      code:
        type: string
      hosts:
        description: Hosts pins the hosts (or host:port) the locator advertises.
        items:
          type: string
        type: array
      role:
        type: string
    type: object
  pairing.ApproveRequest:
    properties:
      role:
        type: string
    type: object
  pairing.ClaimRequest:
    properties:
      app_version:
        type: string
      device_name:
        type: string
      device_pub:
        type: string
      mac:
        type: string
      model:
        type: string
      nonce_device:
        type: string
      offer_id:
        type: string
      platform:
        type: string
      sig:
        type: string
    type: object
  pairing.ClaimResponse:
    properties:
      expires_at:
        type: string
      mac:
        type: string
      nonce_node:
        type: string
      offer_id:
        type: string
      sig:
        type: string
      state:
        $ref: '#/definitions/pairing.State'
    type: object
  pairing.ConfirmRequest:
    properties:
      mac:
        type: string
      offer_id:
        type: string
      sig:
        type: string
    type: object
  pairing.CreateOfferRequest:
    properties:
      hosts:
        description: |-
          Hosts pins the hosts (or host:port) the offer advertises, in
          preference order, instead of the detected ones.
        items:
          type: string
        type: array
      role:
        type: string
      ttl_seconds:
        type: integer
    type: object
  pairing.Device:
    properties:
      app_version:
        type: string
      approved_by:
        type: string
      device_id:
        type: string
      model:
        type: string
      name:
        type: string
      paired_at:
        type: string
      paired_via:
        type: string
      platform:
        type: string
      public_key:
        items:
          type: integer
        type: array
      rev:
        type: integer
      revoked_at:
        type: string
      role:
        $ref: '#/definitions/pairing.Role'
      scopes:
        items:
          type: string
        type: array
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  pairing.DeviceMeta:
    properties:
      app_version:
