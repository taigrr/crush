name: lint
on:
  push:
    branches: [main, feature]
  pull_request:

jobs:
  lint:
    uses: charmbracelet/meta/.github/workflows/lint.yml@main
    with:
      golangci_path: .golangci.yml
      golangci_version: v2.13
      timeout: 10m
      # ebitengine/oto (via gopxl/beep) links ALSA under cgo; golangci
      # type-checks with cgo enabled, so Linux runners need the headers.
      pre-run: |
        if [ "$(uname -s)" = "Linux" ]; then
          sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
        fi
