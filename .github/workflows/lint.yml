name: lint
on:
  push:
    branches: [main, feature]
  pull_request:

jobs:
  lint:
    uses: charmbracelet/meta/.github/workflows/lint.yml@main
    with:
      golangci_path: .golangci.yml
      golangci_version: v2.13
      timeout: 10m
      # The reusable workflow runs pre-run without a shell override, so on
      # Windows it executes under PowerShell. Delegate to bash (available on
      # every runner) so the script can branch on OS.
      pre-run: bash .github/scripts/lint-prerun.sh
